services:
  app-bomflow:
    image: ghcr.io/devs-wescctech/app-bomflow:latest
    container_name: app-bomflow
    restart: unless-stopped
    ports:
      - "5200:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_SSL=false
      - ORCAMENTO_DOCS_DIR=/var/dados/bomflow/orcamento-documentos
      - TRAINING_STORAGE_DRIVER=local
      - TRAINING_STORAGE_DIR=/var/dados/bomflow/treinamentos
    volumes:
      - ./uploads:/app/uploads
      - /var/dados/bomflow/orcamento-documentos:/var/dados/bomflow/orcamento-documentos
      - bomflow-training-data:/var/dados/bomflow/treinamentos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  bomflow-training-data:
    name: bomflow-training-data
